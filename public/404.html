<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Social Klub</title>
    <script>
      const segments = window.location.pathname.split("/").filter(Boolean);
      const isGithubIo = window.location.hostname.endsWith("github.io");
      const basePath = isGithubIo && segments.length > 0 ? "/" + segments[0] + "/" : "/";
      window.location.replace(window.location.origin + basePath);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
